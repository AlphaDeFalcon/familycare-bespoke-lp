    <!-- Boot splash: inline critical CSS so it paints before the app bundle
         downloads. main.tsx fades it out once React has mounted. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b3d26;
        background-image:
          radial-gradient(58% 46% at 50% 44%, rgba(0, 168, 89, 0.22) 0%, rgba(0, 168, 89, 0) 72%),
          linear-gradient(165deg, #0e4a2e 0%, #0b3d26 54%, #072a1a 100%);
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        opacity: 1;
        transition: opacity 320ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
      }
      .boot-splash__emblem {
        position: relative;
        width: 132px;
        height: 132px;
        margin-bottom: 26px;
        animation: boot-splash-emblem-in 560ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      .boot-splash__ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: boot-splash-spin 1.25s linear infinite;
      }
      .boot-splash__ring-track {
        fill: none;
        stroke: rgba(246, 248, 247, 0.16);
        stroke-width: 2.5;
      }
      .boot-splash__ring-arc {
        fill: none;
        stroke: url(#boot-splash-gradient);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 90 269;
      }
      .boot-splash__disc {
        position: absolute;
        inset: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #f6f8f7;
        box-shadow:
          0 0 0 1px rgba(7, 42, 26, 0.06),
          0 22px 48px -24px rgba(0, 0, 0, 0.55);
      }
      .boot-splash__mark {
        width: 72px;
        height: auto;
      }
      .boot-splash__name {
        color: #f6f8f7;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: boot-splash-text-in 460ms cubic-bezier(0.23, 1, 0.32, 1) 120ms both;
      }
      .boot-splash__tagline {
        margin-top: 10px;
        color: #bfd9ca;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-size: 18px;
        line-height: 1.4;
        animation: boot-splash-text-in 460ms cubic-bezier(0.23, 1, 0.32, 1) 200ms both;
      }
      @keyframes boot-splash-emblem-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-splash-text-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (min-width: 640px) {
        .boot-splash__emblem {
          width: 156px;
          height: 156px;
          margin-bottom: 30px;
        }
        .boot-splash__disc {
          inset: 20px;
        }
        .boot-splash__mark {
          width: 86px;
        }
        .boot-splash__name {
          font-size: 13px;
        }
        .boot-splash__tagline {
          font-size: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
        .boot-splash__emblem,
        .boot-splash__name,
        .boot-splash__tagline,
        .boot-splash__ring {
          animation: none;
        }
      }
    </style>
